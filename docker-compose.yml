version: '3.8'
services:
  jenkins:
    build:
      context: .
      dockerfile: .docker/Jenkins/Dockerfile
    image: playwright-jenkins:latest
    container_name: playwright-jenkins
    privileged: true
    user: root
    restart: always
    ports:
      - "8080:8080" # Jenkins Web UI
      - "50000:50000" # Jenkins agent port
    volumes:
      - jenkins_home:/var/jenkins_home # Persist Jenkins data
      - /var/run/docker.sock:/var/run/docker.sock # Docker socket binding
      # /usr/bin/docker not mounted — Docker CLI is installed inside the image.
      # Only the socket mount is needed on Docker Desktop for Windows.
volumes:
  jenkins_home:
    name: jenkins_home